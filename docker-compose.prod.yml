# Production-shaped stack, standalone: postgres, redis, migrations and the api
# built from the production Dockerfile (two static binaries inside one image).
# Differences from the dev docker-compose.yml:
#   - no source mounts and no hot reload: the image is what runs;
#   - postgres and redis are not published to the host, only the api port is;
#   - api restarts unless stopped;
#   - its own project name, so dev "docker-compose up" never clobbers prod
#     images or containers (and vice versa).
#
# Console access (same image, same composition root as the running api):
#   docker-compose -f docker-compose.prod.yml exec api /app/console          # read-only
#   docker-compose -f docker-compose.prod.yml exec api /app/console -write   # writes allowed
name: cosy-console-prod

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cosy_console
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cosy_console"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/cosy_console?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  # Demo data only: a real production database is not seeded on every boot.
  seed:
    image: postgres:17
    volumes:
      - ./db/seeds:/seeds:ro
    command: sh -c 'psql "$$DATABASE_URL" -f /seeds/seed.sql'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cosy_console?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cosy_console?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
